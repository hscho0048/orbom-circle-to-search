[package]
name = "orbom"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["조호성"]
description = "Keyboard and touch friendly Windows visual search"

[target.'cfg(windows)'.dependencies]
wry = { version = "0.55", default-features = false, features = ["os-webview"] }
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }
raw-window-handle = "0.6"
base64 = "0.22"
png = "0.18"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Registry", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs"] }

[workspace]
members = ["installer"]

[profile.release]
lto = true
codegen-units = 1
strip = true
