[package]
name = "orbom-setup"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["조호성"]
description = "Per-user installer for Orbom"
build = "build.rs"

[[bin]]
name = "orbom-setup"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Registry", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }
